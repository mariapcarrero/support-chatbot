name: verify

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be retried from the Actions tab without pushing an empty commit, which
  # matters when a failure might be a registry flake rather than a real break.
  workflow_dispatch:

# Runs `npm run verify` only: typecheck, lint, and the offline unit suite.
#
# It deliberately does NOT run `npm run eval`. That suite calls the real API, costs money per
# case, and is model-graded — so a few cases are intermittent. Wiring it to every push would
# bill on every commit and produce red builds that mean "the model phrased it differently
# this time". The eval suite is a human-run ship gate (`/ship`), not CI.
#
# The consequence worth stating: a green check here means the code compiles, lints, and its
# deterministic behaviour is intact. It does not mean the bot still answers correctly. Those
# are different questions and only one of them is cheap.
#
# No secrets are configured, and none are needed — verified by running the suite with both
# API keys unset. If a test ever starts needing a key, that test has stopped being a unit test.

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # v5: the v4 actions target Node 20, which is deprecated on runners and was being
      # force-migrated to Node 24 with a warning on every run.
      - uses: actions/checkout@v5

      # No `cache: npm`. A restored npm cache is the one part of this job that differs from a
      # clean local `npm ci`, which succeeds — so it is the first variable to remove. The cost
      # is a slower install; the benefit is a job that either works or fails for a reason that
      # is actually about this repository.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Both steps below tee their output into the job summary on failure.
      #
      # The first version of this workflow failed at `npm ci` and reported only "Process
      # completed with exit code 1". Reading the actual error needed an authenticated API
      # call, which is a poor property for the thing whose whole job is telling you what
      # broke. A red check that cannot say why is barely better than no check.
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/install.log || {
            # `::error::` emits an annotation, which is readable from the public API. The job
            # summary is not: the previous attempt wrote there and the reason stayed invisible.
            # HEAD, not tail: npm prints the real error first and then its full usage text,
            # so the tail is all help output and none of the cause.
            echo "::error::npm=$(npm -v) node=$(node -v) -- $(grep -m6 'npm error' /tmp/install.log | tr '\n' ' | ' | cut -c1-800)"
            exit 1
          }

      - name: Typecheck, lint, unit tests
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/verify.log || {
            echo "::error::verify failed -- $(tail -20 /tmp/verify.log | tr '\n' ' | ' | cut -c1-900)"
            exit 1
          }
